name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: make build
      - run: make build-init
      - run: make vet
      - run: make fmtcheck
      - run: make test
      # The privilege drop test needs root; it skips under `make test`.
      - if: runner.os == 'Linux'
        run: |
          go test -c -o "$RUNNER_TEMP/pinit.test" ./internal/guest/pinit
          sudo "$RUNNER_TEMP/pinit.test" -test.run '^TestDropAndExec$' -test.v | tee "$RUNNER_TEMP/drop.out"
          grep -q -- '--- PASS: TestDropAndExec' "$RUNNER_TEMP/drop.out"
